<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- patch frame -->
  <rect width="200" height="200" rx="44" fill="#1d2822"/>
  <circle cx="100" cy="100" r="82" fill="#141414"/>
  <circle cx="100" cy="100" r="74" fill="#2FA033"/>

  <!-- coiled body: black outline pass, then tan color pass -->
  <path d="M 78 78 A 44 44 0 1 0 149 104 C 147 88 136 76 122 76 C 111 76 103 83 101 93"
        fill="none" stroke="#141414" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 78 78 A 44 44 0 1 0 149 104 C 147 88 136 76 122 76 C 111 76 103 83 101 93"
        fill="none" stroke="#C9A265" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- black tail flick at inner end -->
  <path d="M 97 88 C 103 95 107 103 109 113 C 101.5 107.5 97.5 100.5 95.5 94 Z" fill="#141414"/>

  <!-- head, tilted -20°, tucked over the coil start -->
  <g transform="translate(70 66) rotate(-20)">
    <!-- head outline blob -->
    <ellipse cx="0" cy="0" rx="24.5" ry="20.5" fill="#141414"/>
    <!-- tan dome -->
    <path d="M -20.5 3 A 20 16 0 1 1 20.5 3 Q 0 10 -20.5 3 Z" fill="#C9A265"/>
    <!-- cream jaw -->
    <path d="M -20.5 3 Q 0 10 20.5 3 A 20 16 0 0 1 -20.5 3 Z" fill="#F2E3C6"/>
    <!-- mouth seam -->
    <path d="M -20.5 3 Q 0 10 20.5 3" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"/>
    <!-- forked tongue: outline then pink -->
    <path d="M -18 5 C -21 11 -22 14 -22 17 M -22 17 L -27 23 M -22 17 L -18 24"
          fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -18 5 C -21 11 -22 14 -22 17 M -22 17 L -27 23 M -22 17 L -18 24"
          fill="none" stroke="#E86A8A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- one big glossy eye -->
    <circle cx="4" cy="-6" r="7" fill="#141414"/>
    <circle cx="1.5" cy="-8.5" r="2.3" fill="#ffffff"/>
    <!-- nostril -->
    <circle cx="-13" cy="0.5" r="1.5" fill="#141414"/>
  </g>
</svg>